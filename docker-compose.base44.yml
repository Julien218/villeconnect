services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: villeconnect
      MYSQL_USER: villeconnect
      MYSQL_PASSWORD: local-villeconnect-dev
      MYSQL_ROOT_PASSWORD: local-root-dev
    volumes:
      - base44_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  setup:
    image: mysql:8.4
    volumes:
      - .:/app:ro
    environment:
      MYSQL_PWD: local-villeconnect-dev
    entrypoint: ["sh", "/app/.base44/migrate.sh"]
    depends_on:
      db:
        condition: service_healthy
  api:
    image: node:22
    working_dir: /app/server
    volumes:
      - .:/app
      - base44_server_modules:/app/server/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: mysql://villeconnect:local-villeconnect-dev@db:3306/villeconnect
      CORS_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      WEB_APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm ci && npm run build && (node --watch dist/index.js & npx tsc --watch --preserveWatchOutput & wait)"
    ports: ["8000:8000"]
    depends_on:
      setup:
        condition: service_completed_successfully
  web:
    image: node:22
    working_dir: /app/macommune-app
    volumes:
      - .:/app
      - base44_web_modules:/app/macommune-app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      EXPO_PUBLIC_WEB_APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      EXPO_NO_TELEMETRY: 1
    command: sh -c "npm ci && npx expo start --web --port 3000 --host lan"
    ports: ["3000:3000"]
volumes:
  base44_mysql:
  base44_web_modules:
  base44_server_modules:
