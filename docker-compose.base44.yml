services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: villeconnect
      MYSQL_USER: villeconnect
      MYSQL_PASSWORD: local-b44-8fa924ce72
      MYSQL_ROOT_PASSWORD: local-root-4e963fd028
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -e 'SELECT 1' $$MYSQL_DATABASE"]
      interval: 5s
      timeout: 5s
      retries: 40
  setup:
    image: mysql:8.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: local-b44-8fa924ce72
    volumes:
      - .:/workspace:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mysql -h db -uvilleconnect villeconnect < /workspace/.base44/bootstrap.sql
        for n in 007 010 011 012 013 014; do
          for f in /workspace/server/src/migrations/$${n}_*.sql; do
            mysql -h db -uvilleconnect villeconnect < "$$f"
          done
        done
  api:
    image: node:22-bookworm-slim
    working_dir: /workspace/server
    volumes:
      - .:/workspace
      - api_modules:/workspace/server/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: mysql://villeconnect:local-b44-8fa924ce72@db:3306/villeconnect
      CORS_ORIGINS: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      WEB_APP_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      TRUST_PROXY_HOPS: 1
    ports: ["8000:8000"]
    depends_on:
      setup:
        condition: service_completed_successfully
    command: sh -c 'npm ci && npm run dev'
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 60
  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/macommune-app
    volumes:
      - .:/workspace
      - web_modules:/workspace/macommune-app/node_modules
    environment:
      EXPO_PUBLIC_API_URL: https://8000-${BASE44_PUBLIC_HOST_SUFFIX}
      EXPO_NO_TELEMETRY: 1
    ports: ["3000:8081"]
    depends_on:
      api:
        condition: service_healthy
    command: sh -c 'npm ci && npx expo start --web --host lan --port 8081'
volumes:
  mysql_data:
  api_modules:
  web_modules:
