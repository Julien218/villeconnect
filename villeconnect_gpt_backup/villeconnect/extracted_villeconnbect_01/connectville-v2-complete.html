<html lang="fr">
<head>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -0.02em;
        }
        
        body {
            background: #0a0e1a;
            min-height: 100vh;
        }

        .gradient-bg {
            background: radial-gradient(ellipse at top, #1e293b 0%, #0a0e1a 50%);
        }

        .glass-effect {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .glass-bright {
            background: rgba(51, 65, 85, 0.5);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.25);
        }

        .gradient-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
        }

        .gradient-civic {
            background: linear-gradient(135deg, #10b981 0%, #06b6d4 50%, #3b82f6 100%);
        }

        .gradient-merchant {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #ec4899 100%);
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px -5px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(99, 102, 241, 0.5);
        }

        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(1deg); }
            66% { transform: translateY(-10px) rotate(-1deg); }
        }

        .slide-in {
            animation: slideIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { 
                box-shadow: 0 0 30px rgba(99, 102, 241, 0.4), inset 0 0 30px rgba(99, 102, 241, 0.1);
            }
            50% { 
                box-shadow: 0 0 50px rgba(99, 102, 241, 0.6), inset 0 0 40px rgba(99, 102, 241, 0.15);
            }
        }

        .qr-scan-line {
            animation: qrScan 2.5s ease-in-out infinite;
        }

        @keyframes qrScan {
            0%, 100% { transform: translateY(0); opacity: 0.3; }
            50% { transform: translateY(100%); opacity: 1; }
        }

        .wallet-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(51, 65, 85, 0.6) 100%);
            border: 2px solid rgba(99, 102, 241, 0.3);
        }

        .mission-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            border-left: 4px solid #10b981;
        }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .city-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.5);
        }

        .stat-card {
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #d946ef);
        }

        .trust-badge {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: trustPulse 2s ease-in-out infinite;
        }

        @keyframes trustPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .rgpd-badge {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .onboarding-dot {
            transition: all 0.3s ease;
        }

        .onboarding-dot.active {
            width: 32px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
        }

        .transaction-item {
            transition: all 0.3s ease;
        }

        .transaction-item:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }

        .category-tag {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .category-tag:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
        }

        .protection-icon {
            animation: rotateProtection 20s linear infinite;
        }

        @keyframes rotateProtection {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
